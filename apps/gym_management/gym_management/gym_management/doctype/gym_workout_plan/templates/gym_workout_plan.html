{% extends "templates/web.html" %}
{% block page_content %}
<h1>{{ plan_name }} <small>({{ level }})</small></h1>
<div>{{ description or "" }}</div>
<table class="table">
  <tr><th>Exercise</th><th>Sets</th><th>Reps</th><th>Rest (s)</th></tr>
  {% for e in exercises %}
  <tr><td>{{ e.exercise_name }}</td><td>{{ e.sets }}</td><td>{{ e.reps }}</td><td>{{ e.rest_seconds }}</td></tr>
  {% endfor %}
</table>
{% endblock %}
